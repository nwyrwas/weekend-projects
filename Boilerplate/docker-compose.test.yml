version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - NODE_ENV=test
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/api_test_db?schema=public
      - JWT_ACCESS_SECRET=test-access-secret-key-min-32-characters-long
      - JWT_REFRESH_SECRET=test-refresh-secret-key-min-32-characters-long
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=*
      - LOG_LEVEL=error
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000
      - AUTH_RATE_LIMIT_WINDOW_MS=900000
      - AUTH_RATE_LIMIT_MAX_REQUESTS=100
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=api_test_db
    networks:
      - test-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d api_test_db']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data

networks:
  test-network:
    driver: bridge
